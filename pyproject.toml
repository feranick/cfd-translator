[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-translator"
version = "2026.10.21.2"
description = "CFD studies (geometry, fluid, boundary conditions on faces) to OpenFOAM cases and checked results; MCP server"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nicola Ferralis", email = "ferralis@generalflash.com" }]
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
# PyPI has no Gmsh wheels for Linux on ARM (aarch64): there, install python3-gmsh with apt and link
# gmsh.py into the venv (README, Install)
mesh = ["gmsh>=4.11; sys_platform != 'linux' or platform_machine != 'aarch64'"]
mcp = ["mcp>=1.2"]
test = ["pytest"]

[project.scripts]
cfdt = "cfd_translator.cli:main"
cfdt-mcp = "cfd_translator.mcp_server:main"

[tool.setuptools]
packages = ["cfd_translator"]
